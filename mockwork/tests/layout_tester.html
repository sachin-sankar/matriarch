<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QML Inspector — Layout Tester</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2e3345;
      --text: #e2e4eb;
      --text-dim: #8b8fa3;
      --accent: #6c8cff;
      --accent-dim: #3a54b8;
      --green: #3dd68c;
      --red: #f06272;
      --orange: #f5a623;
      --green-pulse: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 20px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subtitle { color: var(--text-dim); margin-bottom: 20px; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topbar select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .topbar .status {
      font-size: 12px;
      color: var(--text-dim);
      margin-left: auto;
    }
    .topbar .status.ok { color: var(--green); }
    .topbar .status.err { color: var(--red); }
    button {
      background: var(--accent-dim);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text-dim);
    }
    button.auto-active {
      background: #1a3a2a;
      border-color: var(--green);
      color: var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .card-role {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .card-role.text_input, .card-role.text_area { background: #1a3a5c; color: #5dade2; }
    .card-role.button { background: #3a2d5c; color: #c39bff; }
    .card-role.checkbox, .card-role.switch { background: #1a3a2a; color: #3dd68c; }
    .card-role.dropdown { background: #3a2d1a; color: #f5a623; }
    .card-role.text { background: #2a2a2a; color: #8b8fa3; }
    .card-id { color: var(--text-dim); font-size: 11px; font-family: monospace; }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }
    .card-meta .label { color: var(--text-dim); }
    .card-meta .val { color: var(--text); }
    .card-meta .val.bool-on { color: var(--green); }
    .card-meta .val.bool-off { color: var(--red); }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .action-group label { font-size: 11px; color: var(--text-dim); }
    .action-group input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: var(--text);
      width: 100px;
    }
    .action-group button { padding: 4px 10px; font-size: 11px; }

    .tree-node { margin-bottom: 4px; }
    .tree-children { padding-left: 16px; border-left: 1px solid var(--border); }
    .tree-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .tree-label:hover { background: var(--surface2); }
    .tree-label .role-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tree-label .node-id { color: var(--text-dim); font-family: monospace; font-size: 11px; }
    .tree-children.collapsed { display: none; }

    .canvas-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .canvas-wrap h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    #layoutCanvas {
      display: block;
      width: 100%;
      border-radius: 4px;
      background: #0d0f14;
    }
    .legend {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .empty {
      color: var(--text-dim);
      padding: 40px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
    .toast.ok { border-color: var(--green); color: var(--green); }
    .toast.err { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
  <h1>QML Inspector — Layout Tester</h1>
  <p class="subtitle">Fetch, inspect, and interact with QML components via <code>/layout</code> and <code>/interact</code></p>

  <div class="topbar">
    <select id="windowSelect" onchange="selectWindow(this.value)">
      <option value="">Loading…</option>
    </select>
    <button id="refreshBtn" onclick="fetchLayout()">⟳ Refresh</button>
    <button id="autoRefreshBtn" class="secondary" onclick="toggleAutoRefresh()">⏺ Auto</button>
    <span class="status" id="status">—</span>
  </div>

  <div class="canvas-wrap">
    <h3>Layout Visualization</h3>
    <canvas id="layoutCanvas" height="400"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#5dade2"></div>text_input / text_area</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c39bff"></div>button</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3dd68c"></div>checkbox / switch</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div>dropdown</div>
    </div>
  </div>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

<script>
const API = 'http://127.0.0.1:8080';
let currentView = 'cards'; // 'cards' | 'tree'
let autoRefresh = false;
let autoRefreshInterval = null;
const AUTO_REFRESH_MS = 1000;
let currentApp = '';
let layoutData = null;
let windows = {};

async function fetchWindows() {
  try {
    const r = await fetch(`${API}/windows`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    windows = await r.json();
    const sel = document.getElementById('windowSelect');
    sel.innerHTML = '<option value="">— all apps —</option>';
    for (const [name, info] of Object.entries(windows)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = info.name;
      sel.appendChild(opt);
    }
    if (sel.options.length > 1) sel.selectedIndex = 1;
  } catch (e) {
    console.error('Failed to fetch windows:', e);
  }
}

function selectWindow(name) {
  currentApp = name;
  fetchLayout();
}

const ROLE_CLASSES = {
  text_input: 'role-text_input',
  text_area: 'role-text_area',
  button: 'role-button',
  checkbox: 'role-checkbox',
  switch: 'role-switch',
  dropdown: 'role-dropdown',
};

const ACTION_MAP = {
  text_input: ['fill', 'focus', 'clear'],
  text_area: ['fill', 'focus', 'clear'],
  button: ['click'],
  checkbox: ['click', 'toggle'],
  switch: ['click', 'toggle'],
  dropdown: ['select', 'focus'],
};

async function fetchLayout() {
  const status = document.getElementById('status');
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  status.textContent = 'fetching…';
  status.className = 'status';
  try {
    let url = `${API}/layout`;
    if (currentApp) url += `?app=${encodeURIComponent(currentApp)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    layoutData = await r.json();
    const title = layoutData?.app_state?.title || currentApp || 'QML App';
    status.textContent = `ok · ${title}${autoRefresh ? ' ⏺' : ''}`;
    status.className = 'status ok';
    render();
  } catch (e) {
    status.textContent = `err: ${e.message}`;
    status.className = 'status err';
    document.getElementById('app').innerHTML = `<div class="empty">Failed to fetch layout: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefresh) {
    btn.classList.add('auto-active');
    btn.textContent = '⏸ Pause';
    autoRefreshInterval = setInterval(fetchLayout, AUTO_REFRESH_MS);
  } else {
    btn.classList.remove('auto-active');
    btn.textContent = '⏺ Auto';
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
  }
  // Update status immediately
  const status = document.getElementById('status');
  if (layoutData) {
    status.textContent = `ok · ${layoutData.app_state?.title || currentApp}${autoRefresh ? ' ⏺' : ''}`;
  }
}

function render() {
  if (!layoutData) return;
  renderCanvas(layoutData);
  const app = document.getElementById('app');
  if (currentView === 'cards') {
    app.innerHTML = renderCards(layoutData);
  } else {
    app.innerHTML = renderTree(layoutData.interactors, 0);
  }
}

function renderCanvas(data) {
  const canvas = document.getElementById('layoutCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 400 * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.height = '400px';

  const W = rect.width;
  const H = 400;
  const dims = data?.app_state?.dimensions || { width: 1920, height: 1050 };
  const pad = 20;
  const availW = W - pad * 2;
  const availH = H - pad * 2;
  const scaleX = availW / dims.width;
  const scaleY = availH / dims.height;
  const scale = Math.min(scaleX, scaleY);
  const frameW = dims.width * scale;
  const frameH = dims.height * scale;
  const ox = (W - frameW) / 2;
  const oy = (H - frameH) / 2;

  ctx.clearRect(0, 0, W, H);

  // Draw app window frame
  ctx.strokeStyle = '#6c8cff';
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, frameW, frameH);

  // Title bar
  ctx.fillStyle = '#1a1d27';
  ctx.fillRect(ox, oy, frameW, 18);
  ctx.strokeStyle = '#2e3345';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox, oy, frameW, 18);
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(dims.title || 'QML App', ox + frameW / 2, oy + 12);
  ctx.textAlign = 'start';

  const ROLE_COLORS = {
    text_input: '#5dade2',
    text_area: '#5dade2',
    button: '#c39bff',
    checkbox: '#3dd68c',
    switch: '#3dd68c',
    dropdown: '#f5a623',
  };

  function drawNode(node) {
    if (!node) return;
    if (node.role && node.coordinates) {
      const c = node.coordinates;
      const x = c.x * scale;
      const y = c.y * scale;
      const w = (c.w || 0) * scale;
      const h = (c.h || 0) * scale;
      const color = ROLE_COLORS[node.role] || '#8b8fa3';

      ctx.fillStyle = color + '40';
      ctx.fillRect(x + ox, y + oy, w, h);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + ox, y + oy, w, h);
    }
    for (const child of (node.children || [])) {
      drawNode(child);
    }
  }

  drawNode(data?.interactors);
}

function renderCards(data) {
  const interactors = data.interactors;
  if (!interactors || !hasInteractors(interactors)) {
    return '<div class="empty">No interactive components found.</div>';
  }
  const cards = [];
  walkInteractors(interactors, cards);
  return `<div class="grid">${cards.join('')}</div>`;
}

function hasInteractors(node) {
  if (!node) return false;
  if (typeof node === 'object') {
    if (node.role) return true;
    for (const child of (node.children || [])) {
      if (hasInteractors(child)) return true;
    }
  }
  return false;
}

function walkInteractors(node, out) {
  if (!node) return;
  if (node.role) {
    out.push(buildCard(node));
  }
  for (const child of (node.children || [])) {
    walkInteractors(child, out);
  }
}

function buildCard(n) {
  const role = n.role;
  const actions = ACTION_MAP[role] || [];
  const roleClass = ROLE_CLASSES[role] || '';
  const cuid = n.cuid || '—';
  const id = n.id || '—';
  const label = n.label || n.accessible_name || '—';
  const value = formatValue(n.value, role);
  const coords = n.coordinates ? `${n.coordinates.x},${n.coordinates.y} (${n.coordinates.w}×${n.coordinates.h})` : '—';
  const focus = n.focus ? '🔵' : '⚪';

  const actionBtns = actions.map(a => {
    if (a === 'fill' || a === 'select') {
      return `<div class="action-group">
        <label>${a}:</label>
        <input type="text" id="val-${cuid}-${a}" placeholder="value…">
        <button onclick="doAction('${esc(cuid)}','${a}')">${a}</button>
      </div>`;
    }
    if (a === 'toggle') {
      return `<div class="action-group">
        <button onclick="doAction('${esc(cuid)}','toggle')">${a}</button>
      </div>`;
    }
    return `<button onclick="doAction('${esc(cuid)}','${a}')">${a}</button>`;
  }).join('');

  return `<div class="card" data-cuid="${esc(cuid)}">
    <div class="card-header">
      <span class="card-role ${roleClass}">${role}</span>
      <span class="card-id">${esc(id)}</span>
    </div>
    <div class="card-meta">
      <span><span class="label">cuid</span><span class="val" style="font-size:10px">${esc(cuid)}</span></span>
      <span><span class="label">label</span><span class="val">${esc(label)}</span></span>
      <span><span class="label">value</span><span class="val ${value === 'true' ? 'bool-on' : value === 'false' ? 'bool-off' : ''}">${esc(value)}</span></span>
      <span><span class="label">focus</span><span class="val">${focus}</span></span>
      <span><span class="label">coords</span><span class="val">${esc(coords)}</span></span>
    </div>
    <div class="card-actions">${actionBtns}</div>
  </div>`;
}

function renderTree(node, depth) {
  if (!node) return '';
  let html = '';
  const role = node.role;
  const isLeaf = !node.children || node.children.length === 0;
  const roleClass = role ? ROLE_CLASSES[node.role] || '' : '';
  const label = node.label || node.id || '';
  const cuid = node.cuid || '';

  const badge = role
    ? `<span class="role-badge ${roleClass}">${role}</span>`
    : '';
  const cuidTag = cuid
    ? `<span class="node-id" title="cuid: ${esc(cuid)}">${esc(cuid)}</span>`
    : '';
  const toggle = !isLeaf ? `<span class="tree-toggle" onclick="toggleNode(this)">▶</span>` : '';

  html += `<div class="tree-node">
    <div class="tree-label" onclick="cardFromTreeNode('${esc(cuid)}')">
      ${toggle}${badge}${cuidTag}<span>${esc(label || node.id)}</span>
    </div>`;

  if (!isLeaf) {
    html += `<div class="tree-children">${node.children.map(c => renderTree(c, depth + 1)).join('')}</div>`;
  }
  html += '</div>';
  return html;
}

function cardFromTreeNode(cuid) {
  // Switch to cards view and highlight the node
  currentView = 'cards';
  render();
  const card = document.querySelector(`[data-cuid="${esc(cuid)}"]`);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.style.outline = '2px solid var(--accent)';
    setTimeout(() => card.style.outline = '', 2000);
  }
}

function toggleNode(el) {
  const children = el.closest('.tree-node').querySelector('.tree-children');
  if (children) {
    children.classList.toggle('collapsed');
    el.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
  }
}

function toggleView() {
  currentView = currentView === 'cards' ? 'tree' : 'cards';
  render();
}

async function doAction(cuid, action) {
  const body = { cuid, action };
  if (currentApp) body.app = currentApp;
  // Collect optional value for fill/select
  if (action === 'fill' || action === 'select') {
    const inp = document.getElementById(`val-${cuid}-${action}`);
    if (inp) body.value = inp.value || null;
  }
  try {
    const r = await fetch(`${API}/interact`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    toast(`✅ ${action} on ${cuid.slice(0, 6)}…`, 'ok');
    await fetchLayout();
  } catch (e) {
    toast(`❌ ${e.message}`, 'err');
  }
}

function formatValue(v, role) {
  if (v === undefined || v === null) return '—';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  return String(v);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2500);
}

fetchWindows();
fetchLayout();
</script>
</body>
</html>
